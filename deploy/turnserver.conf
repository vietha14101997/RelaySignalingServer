# coturn configuration for RemotePlay Relay
# Deploy to /etc/turnserver.conf on VPS
# Docs: https://github.com/coturn/coturn/wiki/turnserver

# Listening ports
listening-port=3478
tls-listening-port=5349
alt-listening-port=3479

# External IP of VPS (MUST CHANGE)
# For AWS/GCP: use external-ip=EXTERNAL_IP/INTERNAL_IP
external-ip=YOUR_PUBLIC_IP

# Relay port range
min-port=49152
max-port=65535

# Authentication: time-limited credentials via shared secret
# MUST match TURN_SECRET env var in Go relay server
use-auth-secret
static-auth-secret=CHANGE_ME_GENERATE_WITH_openssl_rand_hex_32

# Realm (your domain)
realm=relay.remoteplay.app

# TLS certificates (Let's Encrypt)
# cert=/etc/letsencrypt/live/relay.remoteplay.app/fullchain.pem
# pkey=/etc/letsencrypt/live/relay.remoteplay.app/privkey.pem

# Logging
log-file=/var/log/turnserver.log
verbose

# Security: deny relay to private networks
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# Per-session bandwidth cap. coturn max-bps is BYTES/sec: 6_250_000 B/s ≈ 50 Mbps.
# NEVER set bps-capacity: it is the SERVER-WIDE allocation budget — the first
# allocation reserves it all and every later ALLOCATE fails with
# "486 Allocation Bandwidth Quota Reached" (observed in the field 2026-07-11:
# a single WebRTC client opens several TurnPorts, only the first survived).
max-bps=6250000

# Performance
proc-quota-limit=60
total-quota=100
