# coturn base config — RemoteScreen relay (Docker).
# Secret / realm / external-ip / TLS cert are injected at runtime by
# entrypoint.sh (from env + the Caddy-issued certificate). Do NOT hardcode
# secrets here — this file is committed.

# STUN/TURN listener (matches the relay's advertised turn:<domain>:3478 udp+tcp).
listening-port=3478
fingerprint
use-auth-secret

# Relay port range — keep in sync with the firewall (setup-vps.sh) and with
# coturn running on the host network. 40 ports ≈ plenty for a small VPS; widen
# for more concurrent sessions.
min-port=49160
max-port=49200

# ── Anti-abuse (open-relay hardening) ──
# Per-session cap — NEVER 0/unlimited (the /ice-servers-public endpoint hands
# out TURN creds, so an unbounded relay is free bandwidth for anyone).
# coturn max-bps is BYTES/sec: 6_250_000 B/s ≈ 50 Mbps. Raise for higher-bitrate
# relayed sessions. (NB: the original deploy/turnserver.conf mislabelled 5000000
# as "5 Mbps" — that value is actually ~40 Mbps.)
max-bps=6250000
# Server-wide cap on simultaneous relay allocations (bounds DoS). No per-user
# quota: guests currently share one username, so a user-quota would throttle all
# guests at once — total-quota + max-bps bound abuse without that footgun.
total-quota=1200
no-multicast-peers
no-tcp-relay
stale-nonce=600
no-cli

# ── Deny relaying to private / loopback / link-local / CGNAT / metadata ranges ──
# 169.254.0.0/16 blocks the cloud metadata endpoint (169.254.169.254 → SSRF /
# instance-credential theft on AWS/GCP). 100.64/10 = carrier-grade NAT.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Log to stdout so `docker compose logs coturn` shows everything.
log-file=stdout
simple-log
